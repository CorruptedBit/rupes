# rupes foot defaults; override per user in ~/.config/foot/foot.ini.
# The "Mono" variant keeps every glyph exactly one cell wide, which is what a
# terminal needs (the plain "Nerd Font" variant has double-width icons).
[main]
font=Mononoki Nerd Font Mono:size=12
# Inner padding in px (x, y)
pad=8x2 center
