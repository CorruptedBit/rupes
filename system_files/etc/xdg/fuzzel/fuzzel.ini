# rupes fuzzel defaults; override per user in ~/.config/fuzzel/fuzzel.ini.
# Colors are RRGGBBAA and match the palette in /etc/xdg/waybar/style.css.
font=CaskaydiaCove Nerd Font:size=12
terminal=foot -e
prompt="> "
width=40
lines=12

[colors]
background=1c1e26f2
text=d5d8e0ff
prompt=7aa2f7ff
input=d5d8e0ff
match=7aa2f7ff
selection=262a35ff
selection-text=d5d8e0ff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=10
