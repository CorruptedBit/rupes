# Keyboard layout: US international with AltGr dead keys (the image default).
#
# To use a different layout on a specific machine (e.g. an Italian keyboard),
# create a file with the same name in ~/.config/sway/config.d/20-keyboard.conf:
# it fully replaces this one (see the layered include in /etc/sway/config).
#
#   input type:keyboard {
#       xkb_layout it
#   }
input type:keyboard {
    xkb_layout us
    xkb_variant altgr-intl
}
