# rupes customisations on top of Fedora's sway-config-fedora.
# Loaded through the layered include at the end of /etc/sway/config, so
# $term is already defined here.

### Input
input type:touchpad {
    tap enabled
    natural_scroll enabled
}

### Layout
default_orientation horizontal

# Automatic horizontal/vertical split based on window dimensions
# (system_files/usr/bin/autotiling, vendored from nwg-piotr/autotiling).
exec autotiling

# Gaps
gaps inner 4
gaps outer 0
smart_gaps off

# Window decorations: thin (1px) borders, muted pastels (Nord frost for focus).
# Only child_border (last field) is visible with "pixel" borders; trailing
# two hex digits are alpha, which keeps the colours soft.
default_border pixel 1
default_floating_border pixel 1

# client.<state>          <border>   <background> <text>    <indicator> <child_border>
client.focused            #88c0d0b0  #2e3440      #eceff4   #88c0d0b0   #88c0d0b0
client.focused_inactive   #d8dee930  #2e3440      #d8dee9   #d8dee930   #d8dee930
client.focused_tab_title  #d8dee930  #2e3440      #d8dee9
client.unfocused          #d8dee928  #2e3440      #7b88a1   #d8dee928   #d8dee928
client.urgent             #ebcb8bc0  #2e3440      #eceff4   #ebcb8bc0   #ebcb8bc0
client.placeholder        #d8dee928  #2e3440      #7b88a1   #d8dee928   #d8dee928

### Wallpaper
# Overrides Fedora's default.jxl set in /etc/sway/config (this file is included
# at the end). Single wallpaper for now, no light/dark switching.
output * bg /usr/share/backgrounds/rupes/wallhaven-yqv2wx.jpg fill
