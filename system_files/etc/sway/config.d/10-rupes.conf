# rupes customisations on top of Fedora's sway-config-fedora.
# Loaded through the layered include at the end of /etc/sway/config, so
# $term is already defined here.

### Input
input type:touchpad {
    tap enabled
    natural_scroll enabled
}

### Key bindings
bindsym $mod+t exec $term

### Layout
default_orientation horizontal

# Gaps
gaps inner 4
gaps outer 0
smart_gaps off

# Window decorations
default_border none
default_floating_border none
