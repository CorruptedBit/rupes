# rupes customisations on top of Fedora's sway-config-fedora.
# Loaded through the layered include at the end of /etc/sway/config, so
# $term is already defined here.

### Input
input type:touchpad {
    tap enabled
    natural_scroll enabled
}

### Layout
default_orientation horizontal

# Automatic horizontal/vertical split based on window dimensions
# (system_files/usr/bin/autotiling, vendored from nwg-piotr/autotiling).
exec autotiling

# Gaps
gaps inner 4
gaps outer 0
smart_gaps off

# Window decorations
default_border none
default_floating_border none
