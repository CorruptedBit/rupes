# rupes essentials on top of Fedora's sway-config-fedora: only what the
# desktop needs to work (input, autotiling, launcher, wallpaper). Looks and
# taste (gaps, borders, colours) live in the skeleton
# ~/.config/sway/config.d/99-user.conf instead.
#
# Loaded through the layered include at the end of /etc/sway/config, which
# reads every *.conf from /usr/share/sway/config.d, /etc/sway/config.d and
# ~/.config/sway/config.d in alphabetical order of file name (a same-named
# file in a later directory replaces the earlier one). 97- loads after all of
# Fedora's files, so what is set here wins; sway keeps the last value for
# single-value settings and for a bindsym on the same key. $mod, $term and
# the other variables come from /etc/sway/config.

### Input
input type:touchpad {
    tap enabled
    natural_scroll enabled
}

# Keyboard: no `input type:keyboard` here on purpose. The layout follows the
# system setting (`localectl set-x11-keymap <layout> [model] [variant]`), the
# same one the login screen and the console use. This script applies it to
# sway and keeps following changes. It overrides `input type:keyboard` blocks
# in config files; use a device identifier for a per-device override.

# watcher: once per session, follows localectl changes
exec /usr/libexec/sway-systemd/locale1-xkb-config 
# on every reload: re-apply layout, then exit
exec_always /usr/libexec/sway-systemd/locale1-xkb-config --oneshot 

### Layout
# Automatic horizontal/vertical split based on window dimensions
# (system_files/usr/bin/autotiling, vendored from nwg-piotr/autotiling).
exec autotiling

### Key bindings
# Start a terminal
bindsym $mod+t exec $term

# Application launcher: fuzzel replaces Fedora's default rofi on $mod+d
unbindsym $mod+d
bindsym $mod+d exec fuzzel

# Kill focused window: $mod+q replaces Fedora's default $mod+Shift+q
unbindsym $mod+Shift+q
bindsym $mod+q kill

# Screenshots (grim/slurp, shipped with the Fedora sway spin) saved in $HOME
bindsym $mod+p exec grim -g "$(slurp)" ~/screenshot-$(date +%s).png
bindsym $mod+Shift+p exec grim ~/screenshot-$(date +%s).png

### Wallpaper
# Overrides Fedora's default.jxl set in /etc/sway/config. Single wallpaper
# for now, no light/dark switching.
output * bg /usr/share/backgrounds/rupes/wallhaven-yqv2wx.jpg fill
