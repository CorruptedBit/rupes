# Your personal sway configuration.
#
# How sway loads its configuration:
#   1. /etc/sway/config is the entry point (Fedora's).
#   2. At its end it includes every *.conf found in these directories:
#        /usr/share/sway/config.d/   Fedora's defaults and rupes (97-rupes.conf)
#        /etc/sway/config.d/         machine-wide local changes
#        ~/.config/sway/config.d/    this directory
#      Files are read in alphabetical order of their *name*, whatever the
#      directory, so 99-user.conf is read last and wins over everything else:
#      the last value wins for single-value settings and for a bindsym on the
#      same key; for_window and exec rules add up instead.
#   3. A file with the same name in a later directory replaces the earlier one
#      entirely (it is not merged).
#
# To start from scratch with your own configuration, create
# ~/.config/sway/config: sway reads it instead of /etc/sway/config, so neither
# Fedora's nor rupes' settings are loaded unless it includes them.
#
# Not from scratch: your ~/.config/sway/config can pull in existing files with
# the sway `include` command (see `man 5 sway`), which accepts globs:
#
#   # Everything (Fedora + rupes + this directory): the usual starting point,
#   # then add or override your own settings below the include.
#   include /etc/sway/config
#
#   # Or only some pieces, e.g. Fedora's rules and key bindings but not rupes:
#   # (variables like $mod and $term are defined in /etc/sway/config, so
#   # define them yourself first)
#   set $mod Mod4
#   set $term foot
#   include /usr/share/sway/config.d/50-rules-*.conf
#   include /usr/share/sway/config.d/60-bindings-*.conf
#
#   # Any other file or directory of yours works the same way:
#   include ~/.config/sway/extra.conf
#   include ~/.config/sway/my-config.d/*.conf
#
# Don't include the same file twice (e.g. /etc/sway/config and a file it
# already loads): exec and for_window rules would run twice.

### Keyboard layout
# rupes defaults to US international with AltGr dead keys (altgr-intl).
# Uncomment the block below for an Italian keyboard. Reset the variant too,
# or altgr-intl stays applied. For other options see:
# https://man.archlinux.org/man/sway-input.5
#
#input type:keyboard {
#    xkb_layout it
#    xkb_variant ""
#}
#
# rupes default, for reference:
#
#input type:keyboard {
#    xkb_layout us
#    xkb_variant altgr-intl
#}



### Gaps
# Space between windows (inner) and between windows and screen edges (outer).
# rupes default: inner 4, outer 0. See `man 5 sway`, section "gaps".
#
#gaps inner 8
#gaps outer 4
#smart_gaps on



### Borders and colors
# rupes default: 1px borders, Nord-like colors with some transparency
# (the last two hex digits are the alpha channel).
# With "pixel" borders only <child_border> (last field) is visible.
#
#default_border pixel 2
#default_floating_border pixel 2
#
# client.<state>          <border>   <background> <text>    <indicator> <child_border>
#client.focused            #88c0d0    #2e3440      #eceff4   #88c0d0     #88c0d0
#client.focused_inactive   #d8dee9    #2e3440      #d8dee9   #d8dee9     #d8dee9
#client.unfocused          #4c566a    #2e3440      #7b88a1   #4c566a     #4c566a
#client.urgent             #ebcb8b    #2e3440      #eceff4   #ebcb8b     #ebcb8b



### Tiling
# rupes runs autotiling (started by 97-rupes.conf), which picks horizontal or
# vertical splits from the focused window's shape. It keeps running whatever
# you set here; to stop it, run `pkill autotiling` or start from your own
# ~/.config/sway/config. These settings still apply:
#
# Initial split direction on an empty workspace: horizontal | vertical | auto
#default_orientation vertical
#
# How windows are arranged by default: default | stacking | tabbed
#workspace_layout tabbed



### Window titles
# rupes uses "pixel" borders, so there is no title bar. For a title bar on
# every window use a "normal" border (the number is the border width):
#
#default_border normal 2
#default_floating_border normal 2
#
# Look of the title bar:
#font pango:CaskaydiaCove Nerd Font 10
#title_align left
#titlebar_padding 6 2
#
# Text shown in the title; %title and %app_id are the usual placeholders:
#for_window [app_id=".*"] title_format "%app_id - %title"

### Idle
# Don't let the screen lock/blank while any window (Wayland or XWayland) is
# fullscreen, e.g. video players or games.
for_window [class="^.*"] inhibit_idle fullscreen
for_window [app_id="^.*"] inhibit_idle fullscreen