# Per-user foot config, copied from /etc/skel when the user is created.
#
# foot reads only ONE config file: if ~/.config/foot/foot.ini exists, the
# system-wide rupes defaults in /etc/xdg/foot/foot.ini are ignored entirely.
# The include below loads them first, so you keep rupes' defaults (and any
# future updates to them) and only need to list what you want to change.
#
# `include` must stay before any [section].
include=/etc/xdg/foot/foot.ini

# Your overrides go below; they win over the included defaults. Example:
# [main]
# font=Mononoki Nerd Font Mono:size=14
#
# [colors]
# alpha=0.9

# Theme
# include=/usr/share/foot/themes/<theme-name>