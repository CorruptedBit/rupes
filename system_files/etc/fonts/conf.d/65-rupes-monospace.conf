<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Make "monospace" resolve to Mononoki Nerd Font Mono (shipped in
       /usr/share/fonts/Mononoki) for every app that asks for the generic
       family.-->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Mononoki Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
