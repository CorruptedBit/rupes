# rupes customisations on top of Fedora's sway-config-fedora.
#
# Loaded through the layered include at the end of /etc/sway/config, which
# reads every *.conf from /usr/share/sway/config.d, /etc/sway/config.d and
# ~/.config/sway/config.d in alphabetical order of file name (a same-named
# file in a later directory replaces the earlier one). The 97- prefix makes
# this file load after all of Fedora's (50-rules, 60-bindings, 90-swayidle,
# 95-autostart), so what is set here wins; sway keeps the last value for
# single-value settings and for a bindsym on the same key. $mod, $term and
# the other variables come from /etc/sway/config.
#
# Per-machine/user overrides: put them in ~/.config/sway/config.d/99-user.conf
# (read after this file) or in /etc/sway/config.d/.

### Input
input type:touchpad {
    tap enabled
    natural_scroll enabled
}

# Keyboard layout: US international with AltGr dead keys (the image default).
# To use another layout (e.g. an Italian keyboard), override it in a later
# file; reset the variant too, or altgr-intl stays applied:
#
#   input type:keyboard {
#       xkb_layout it
#       xkb_variant ""
#   }
#
# The ready-made commented block is in the skeleton
# ~/.config/sway/config.d/99-user.conf.
input type:keyboard {
    xkb_layout us
    xkb_variant altgr-intl
}

### Layout
default_orientation horizontal

# Automatic horizontal/vertical split based on window dimensions
# (system_files/usr/bin/autotiling, vendored from nwg-piotr/autotiling).
exec autotiling

# Gaps
gaps inner 4
gaps outer 0
smart_gaps off

# Window decorations: thin (1px) borders, muted pastels (Nord frost for focus).
# Only child_border (last field) is visible with "pixel" borders; trailing
# two hex digits are alpha, which keeps the colours soft.
default_border pixel 1
default_floating_border pixel 1

# client.<state>          <border>   <background> <text>    <indicator> <child_border>
client.focused            #88c0d0b0  #2e3440      #eceff4   #88c0d0b0   #88c0d0b0
client.focused_inactive   #d8dee930  #2e3440      #d8dee9   #d8dee930   #d8dee930
client.focused_tab_title  #d8dee930  #2e3440      #d8dee9
client.unfocused          #d8dee928  #2e3440      #7b88a1   #d8dee928   #d8dee928
client.urgent             #ebcb8bc0  #2e3440      #eceff4   #ebcb8bc0   #ebcb8bc0
client.placeholder        #d8dee928  #2e3440      #7b88a1   #d8dee928   #d8dee928

### Key bindings
# Start a terminal
bindsym $mod+t exec $term

# Application launcher: fuzzel replaces Fedora's default rofi on $mod+d
unbindsym $mod+d
bindsym $mod+d exec fuzzel

# Kill focused window: $mod+q replaces Fedora's default $mod+Shift+q
unbindsym $mod+Shift+q
bindsym $mod+q kill

# Screenshots (grim/slurp, shipped with the Fedora sway spin) saved in $HOME
bindsym $mod+p exec grim -g "$(slurp)" ~/screenshot-$(date +%s).png
bindsym $mod+Shift+p exec grim ~/screenshot-$(date +%s).png

### Wallpaper
# Overrides Fedora's default.jxl set in /etc/sway/config. Single wallpaper
# for now, no light/dark switching.
output * bg /usr/share/backgrounds/rupes/wallhaven-yqv2wx.jpg fill
